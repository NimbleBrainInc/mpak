# Production overrides for mpak Helm chart.
# Usage: helm install mpak ./deploy/kubernetes/helm/mpak -f ./deploy/kubernetes/helm/mpak/values.production.yaml

# -- Registry ------------------------------------------------------------------
registry:
  replicaCount: 3

  # Preferred way to give the registry S3 access: name a ServiceAccount already
  # bound to a cloud identity (on EKS, one annotated with
  # eks.amazonaws.com/role-arn) and hold no credentials at all. The chart does
  # not create it. Leaving this unset falls back to the `default` ServiceAccount,
  # which carries no identity — then S3 credentials must come from the Secret.
  # serviceAccountName: ""

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75

  env:
    NODE_ENV: production
    PORT: "3200"
    HOST: "0.0.0.0"
    STORAGE_TYPE: s3
    MAX_BUNDLE_SIZE_MB: "100"
    SCANNER_ENABLED: "true"

  # Scrape via the ServiceMonitor below (operator-based), which targets the
  # dedicated internal metrics port — not the public app port.
  serviceMonitor:
    enabled: true

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values: [registry]
            topologyKey: kubernetes.io/hostname

# -- Web -----------------------------------------------------------------------
web:
  replicaCount: 3

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values: [web]
            topologyKey: kubernetes.io/hostname

# -- Ingress -------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/rate-limit-rps: "50"

  registry:
    host: registry.mpak.dev
    tls:
      enabled: true
      secretName: mpak-registry-tls

  web:
    host: mpak.dev
    tls:
      enabled: true
      secretName: mpak-web-tls

# -- Config --------------------------------------------------------------------
config:
  corsOrigins: "https://mpak.dev"
  s3Region: us-east-1

# -- Secrets -------------------------------------------------------------------
secrets:
  # In production, use an externally managed secret.
  #
  # This recipe is the one shape the chart cannot check for you: it manages no
  # Secret, so it cannot tell whether yours carries S3 credentials under the
  # current key names (aws-access-key-id / aws-secret-access-key) or the ones
  # this chart used to read (s3-*). Stale names satisfy no lookup and the
  # registry deploys with no S3 credentials. Prefer giving the pod an identity
  # and holding no keys at all — see registry.serviceAccountName at the top of
  # this file.
  existingSecret: mpak-secrets

# -- Persistence (disabled in production; use S3) ------------------------------
persistence:
  enabled: false
