# Default values for mpak Helm chart.
# Override these in values.production.yaml or via --set flags.

# -- Global settings ----------------------------------------------------------
global:
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Override the namespace
  namespace: ""

# -- Registry API Server ------------------------------------------------------
registry:
  replicaCount: 2

  image:
    repository: ghcr.io/nimblebraininc/mpak-registry
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  # Point this at a ServiceAccount you have bound to a cloud identity to give
  # the registry S3 access without static keys (on EKS, one annotated with
  # eks.amazonaws.com/role-arn). The chart does not create it.
  serviceAccountName: ""

  service:
    type: ClusterIP
    port: 3200

  # Prometheus metrics are served on a separate internal port so /metrics is
  # NOT reachable through the public ingress (which routes `/` to the app).
  metrics:
    port: 9090

  # Optional ServiceMonitor (requires the Prometheus Operator CRDs). Off by
  # default for self-hosters without the operator; enable per environment.
  serviceMonitor:
    enabled: false
    interval: 30s

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Autoscaling
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Environment variables (non-secret)
  env:
    NODE_ENV: production
    PORT: "3200"
    HOST: "0.0.0.0"
    STORAGE_TYPE: s3
    MAX_BUNDLE_SIZE_MB: "50"
    SCANNER_ENABLED: "true"

  # Node selector, tolerations, affinity
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Pod annotations
  podAnnotations: {}

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# -- Registry Ingest -----------------------------------------------------------
# Nightly mirror of MCPB bundles from an upstream MCP Registry. The upstream
# registry is a metaregistry that makes no security or quality judgement by
# design; this job pulls the bytes so mpak can verify and scan them.
#
# Off by default. It writes third-party content into the catalog, which is a
# decision an operator should make deliberately rather than inherit.
ingest:
  enabled: false

  # 02:00 daily. Nothing depends on the hour; off-peak keeps the bandwidth and
  # the scan-job burst away from daytime API traffic.
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"

  registryUrl: "https://registry.modelcontextprotocol.io/v0"

  # Higher than the publish limit (MAX_BUNDLE_SIZE_MB). Bundles here are
  # whatever upstream already accepted, and compiled multi-platform servers run
  # an order of magnitude larger than interpreted ones. Anything above this is
  # skipped and counted, not silently dropped.
  #
  # 400MB is chosen for headroom, not to fit the current corpus exactly: the
  # largest valid bundle upstream today is 248MB, so a tighter cap would drop it
  # on its next release for no reason anyone would think to look for.
  maxBundleSizeMB: 400

  # Concurrent server pipelines. This is a MEMORY knob before it is a throughput
  # knob: bundle inspection reads each archive fully into heap, so peak usage is
  # concurrency × maxBundleSizeMB. The job refuses to start if that product
  # exceeds memoryBudgetMB, so raise these three together or not at all.
  concurrency: 2

  # Ceiling for concurrent archive buffers. resources.limits.memory below is
  # this plus headroom for the Node runtime, zip entry tables, and the S3 SDK.
  memoryBudgetMB: 1024

  # Re-read this far before the last watermark. Ingest is idempotent, so the
  # overlap costs a few cheap "unchanged" decisions, while a gap is silent.
  overlapMinutes: 60

  # Furthest back a retryable failure may drag the next window. 21 of the 388
  # upstream MCPB URLs do not resolve, so without a bound the first backfill
  # pins the watermark on a dead asset and every later run re-reads an
  # ever-widening span.
  maxHoldbackHours: 72

  # Upstream is a third party on the public internet. The download bound is the
  # larger of the two because a 400MB bundle over a slow release CDN is a normal
  # run, not a hang.
  requestTimeoutMs: 30000
  downloadTimeoutMs: 120000

  # Extra CLI flags, e.g. ["--full"] to ignore the watermark and re-read the
  # whole upstream catalog.
  extraArgs: []

  # A first backfill walks the entire upstream catalog. Six hours is generous
  # for that; steady-state incremental runs finish in minutes.
  activeDeadlineSeconds: 21600
  startingDeadlineSeconds: 3600
  # No retry. Whatever a run could not read, it holds the watermark back for, so
  # the next scheduled run picks it up on its own window — an immediate retry
  # just repeats whatever broke, a night earlier.
  backoffLimit: 0
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # Bundles stream through /tmp on the way to S3, one at a time per pipeline.
  scratchSizeLimit: "4Gi"

  # limits.memory = memoryBudgetMB (1Gi of archive buffers) + ~1Gi headroom.
  # Derived, not guessed — see the concurrency note above.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# -- Web Frontend --------------------------------------------------------------
web:
  replicaCount: 2

  image:
    repository: ghcr.io/nimblebraininc/mpak-web
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101  # nginx-unprivileged UID
    fsGroup: 101

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # nginx needs to write tmp files
    capabilities:
      drop: [ALL]

# -- Ingress -------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"

  # Registry API host
  registry:
    host: registry.mpak.dev
    tls:
      enabled: true
      secretName: mpak-registry-tls

  # Web UI host
  web:
    host: mpak.dev
    tls:
      enabled: true
      secretName: mpak-web-tls

# -- ConfigMap (non-secret configuration) --------------------------------------
config:
  # CORS origins (comma-separated)
  corsOrigins: "https://mpak.dev"
  # S3 region
  s3Region: us-east-1

# -- Secrets -------------------------------------------------------------------
# These should be created externally (e.g., via ExternalSecrets, SealedSecrets,
# or kubectl create secret). Set existingSecret to reference a pre-existing secret.
secrets:
  # Use an existing secret instead of creating one from the chart.
  #
  # The chart cannot see inside a Secret it does not manage, so nothing here can
  # catch a stale key name for you: a Secret still holding s3-access-key-id /
  # s3-secret-access-key satisfies no lookup, and the registry deploys with no S3
  # credentials at all. Rename those keys to aws-access-key-id /
  # aws-secret-access-key, or remove them and bind the pod to a cloud identity
  # through registry.serviceAccountName.
  existingSecret: ""

  # Only used if existingSecret is empty (NOT recommended for production)
  databaseUrl: ""
  clerkSecretKey: ""
  clerkPublishableKey: ""
  s3Bucket: ""
  # Long-lived keys only. Leave empty on a cluster that gives the registry pod
  # an AWS identity (IRSA — annotate a ServiceAccount and set
  # registry.serviceAccountName), which is the better arrangement anyway.
  #
  # There is deliberately no session-token key here. A pod's environment is
  # fixed when the pod is created and never refreshes, so temporary credentials
  # would expire mid-life with no way to renew them. Pod identity is the
  # refreshing equivalent, and it is what this chart steers you toward.
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  cloudfrontDomain: ""
  cloudfrontKeyPairId: ""
  cloudfrontPrivateKeyBase64: ""
  scannerCallbackSecret: ""

# -- Persistent Volume Claim (for local storage mode) -------------------------
persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  annotations: {}

# -- PostgreSQL (subchart or external) -----------------------------------------
# Set to true to deploy PostgreSQL as part of this chart.
# For production, use an external managed database (RDS, Cloud SQL, etc.)
postgresql:
  enabled: false
  # If using an external database, set the URL in secrets.databaseUrl
